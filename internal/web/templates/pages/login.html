{{define "content"}}
<section class="login-panel">
  <a class="brand login-brand" href="/">
    <span class="brand-mark" aria-hidden="true">P</span>
    <span>Pal-pal</span>
  </a>
  <div>
    <h1>Sign in</h1>
    <p class="lede">{{if .PublicRead}}The admin password unlocks player controls and server settings.{{else}}Enter your viewer or admin password.{{end}}</p>
  </div>
  {{if .Error}}<div class="notice notice-error" role="alert">{{.Error}}</div>{{end}}
  <form class="form-stack" method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="button button-primary" type="submit">Sign in</button>
  </form>
  {{if .PublicRead}}<a class="text-link" href="/">Continue without signing in</a>{{end}}
</section>
{{end}}
