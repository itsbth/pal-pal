{{define "content"}}
<section class="login-panel">
  <a class="brand login-brand" href="/">
    <span class="brand-mark" aria-hidden="true">P</span>
    <span>Pal-pal</span>
  </a>
  <div>
    <p class="eyebrow">Server companion</p>
    <h1>Sign in</h1>
    <p class="lede">{{if .PublicRead}}Enter the admin password to unlock server controls.{{else}}Use a viewer or admin password to continue.{{end}}</p>
  </div>
  {{if .Error}}<div class="notice notice-error" role="alert">{{.Error}}</div>{{end}}
  <form class="form-stack" method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="button button-primary" type="submit">Continue</button>
  </form>
  {{if .PublicRead}}<a class="text-link" href="/">Continue with read-only access</a>{{end}}
</section>
{{end}}
