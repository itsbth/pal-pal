{{define "content"}}
<header class="page-heading">
  <div>
    <p class="eyebrow">Live server</p>
    <h1>Overview</h1>
  </div>
  <span class="refresh-note">Refreshes automatically</span>
</header>
<section
  class="component-frame"
  hx-get="/components/overview"
  hx-trigger="load, every 15s"
  hx-swap="innerHTML"
  aria-live="polite"
>
  <div class="skeleton skeleton-overview" aria-label="Loading server overview"></div>
</section>
{{end}}
