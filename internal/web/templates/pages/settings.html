{{define "content"}}
<header class="page-heading">
  <div>
    <p class="eyebrow">Admin only</p>
    <h1>Server settings</h1>
  </div>
  <span class="role-badge role-admin">Sensitive</span>
</header>
{{if .Error}}
<div class="notice notice-error" role="alert">{{.Error}}</div>
{{else}}
<div class="settings-list" aria-label="Palworld server settings">
  {{range .Settings}}
  <div class="setting-row">
    <dt>{{.Name}}</dt>
    <dd>{{.Value}}</dd>
  </div>
  {{else}}
  <p class="empty-state">No settings were returned by the server.</p>
  {{end}}
</div>
{{end}}
{{end}}
