{{define "content"}}
<header class="page-heading">
  <h1>Settings</h1>
  <span class="refresh-note">Read-only, as reported by the server</span>
</header>
{{if .Error}}
<div class="notice notice-error" role="alert">{{.Error}}</div>
{{else if .Settings}}
<dl class="settings-list">
  {{range .Settings}}
  <div class="setting-row">
    <dt>{{.Name}}</dt>
    <dd>{{.Value}}</dd>
  </div>
  {{end}}
</dl>
{{else}}
<div class="empty-state">
  <strong>Nothing to show</strong>
  <span>The server did not report any settings.</span>
</div>
{{end}}
{{end}}
